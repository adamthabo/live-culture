<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Live Culture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="format-detection" content="telephone=no,email=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,100..900&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: one screen, a few worlds. The world fills the whole screen edge to edge; the name of the world and its live
   readings sit top left; along the bottom, a row of small circles that are the music (the whole band, then its nine
   players) and under it the worlds. Nothing else.
   Single dark look by choice: these are things that glow. */
:root{
  --abyss:#01040a;
  --ink:#eaf9ff;
  --dim:rgba(234,249,255,.62);
  --faint:rgba(234,249,255,.18);
  --lume:#3ef0ff;
  --warm:#ffb347;
  --pink:#ff2d8a;
  --display:"Anybody","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--abyss);color:var(--ink);font-family:var(--display);overflow:hidden;-webkit-font-smoothing:antialiased;
  touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent;margin:0;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--lume);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#gl,#ov{position:fixed;inset:0;width:100%;height:100%;display:block;transition:opacity .22s}
#gl{z-index:1;background:var(--abyss)}
#ov{z-index:2;pointer-events:none}
#stage{position:fixed;inset:0;z-index:3;touch-action:none;cursor:crosshair}
body.sw #gl,body.sw #ov,body.sw .vid{opacity:0}
/* Live: the camera's window, under the overlay and over the Earth. Never touched, except when a stream waits for a tap of its own */
.vid{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden;transition:opacity .22s}
.vid .vb{position:absolute;left:0;top:0;opacity:0;transition:opacity .7s;background:#000;will-change:transform}
.vid .vb.on{opacity:1}
.vid .vb.port{-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 9%,#000 91%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 9%,#000 91%,transparent 100%)}
.vid .vb.land{-webkit-mask-image:radial-gradient(ellipse 74% 72% at 50% 50%,#000 66%,transparent 100%);mask-image:radial-gradient(ellipse 74% 72% at 50% 50%,#000 66%,transparent 100%)}
.vid .vb.disk{background:transparent;-webkit-mask-image:none;mask-image:none}
.vid #vidp,.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
.vid img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.vid.tap{z-index:4}
.vid.tap .vb{pointer-events:auto}
/* a little dusk at the top, so the readings can be read over anything bright (a photo, the day side of the Earth) */
body::before{content:"";position:fixed;z-index:4;left:0;right:0;top:0;height:calc(170px + env(safe-area-inset-top,0px));pointer-events:none;
  background:linear-gradient(to bottom,rgba(1,4,10,.62),rgba(1,4,10,.38) 45%,rgba(1,4,10,0))}
body.dropping::after{content:"";position:fixed;inset:10px;z-index:30;border:1px dashed var(--lume);border-radius:14px;pointer-events:none}

/* ---------- top: the name, the readings, the switch ---------- */
.top{position:fixed;z-index:6;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.mark{min-width:0;display:flex;flex-direction:column;gap:3px}
.mark h1{margin:0;font-weight:700;font-variation-settings:"wdth" 122;font-size:9px;line-height:1;letter-spacing:.3em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.mark .wname{margin:0;font-weight:800;font-variation-settings:"wdth" 62;font-size:34px;line-height:.92;letter-spacing:.01em;text-transform:uppercase;color:var(--ink);white-space:nowrap;
  text-shadow:0 0 22px rgba(1,4,10,.9)}
.data{position:fixed;z-index:6;margin:0;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));
  font-family:var(--mono);font-size:10px;line-height:1.55;letter-spacing:.08em;text-transform:uppercase;color:var(--c,var(--dim));pointer-events:none;
  font-variant-numeric:tabular-nums;max-width:min(64ch,100%);text-shadow:0 0 8px rgba(1,4,10,1),0 0 2px rgba(1,4,10,1);white-space:pre-line;text-wrap:balance}
.acts{flex:0 0 auto;display:flex;align-items:center;gap:8px;pointer-events:auto}
.ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--faint);background:rgba(1,4,10,.55);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:var(--ink);transition:border-color .3s,color .3s,box-shadow .3s}
.ic svg{width:15px;height:15px;display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ic:hover,.ic[aria-pressed=true]{border-color:var(--lume);color:var(--lume);box-shadow:0 0 16px -4px var(--lume)}
.chip{height:32px;padding:0 11px;border-radius:999px;border:1px solid var(--warm);background:rgba(1,4,10,.55);color:var(--warm);
  font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
/* ---------- bottom: the music as small circles (a note for the whole band, then one circle a player), then the worlds.
   No switch: the owner asked for little track circles instead of a toggle ---------- */
.foot{position:fixed;z-index:6;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.dots{display:flex;justify-content:center;align-items:center;gap:2px;pointer-events:auto;width:100%;max-width:400px}
/* Smoke's tools: a labelled row along the bottom, like Wind's layers */
.tools{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;pointer-events:auto;padding:0 4px}
.tb{display:flex;align-items:center;gap:4px;height:28px;padding:0 8px 0 6px;border-radius:14px;border:1px solid rgba(234,249,255,.14);color:var(--dim);background:rgba(1,4,10,.45);
  font-family:var(--mono);font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;transition:color .2s,border-color .2s,background .2s}
.tb span{order:2;line-height:1}
.tb svg{order:1;width:14px;height:14px;display:block;flex:none;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.tb[aria-pressed=true]{color:var(--lume);border-color:rgba(62,240,255,.5);background:rgba(62,240,255,.1)}
#t_puz[aria-pressed=true]{color:var(--warm);border-color:rgba(255,190,90,.55);background:rgba(255,190,90,.1)}
@media (max-width:370px){.tb{padding:0 6px 0 5px;gap:3px;letter-spacing:.03em}}
/* Wind's layers: small labelled switches in a row, each lit while its layer shows */
.lyr{display:flex;justify-content:center;gap:6px;pointer-events:auto;flex-wrap:wrap;padding:0 8px}
.lb{display:flex;align-items:center;gap:5px;height:26px;padding:0 10px 0 8px;border-radius:13px;border:1px solid rgba(234,249,255,.14);color:var(--dim);
  font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;transition:color .25s,border-color .25s,background .25s}
.lb svg{width:13px;height:13px;display:block;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.lb[aria-pressed=true]{color:var(--ink);border-color:rgba(62,240,255,.42);background:rgba(62,240,255,.08)}
.dots9{display:flex;flex:1 1 auto;min-width:0;justify-content:center;transition:opacity .3s}
.dots.off .dots9{opacity:.38}
.dot{flex:1 1 0;min-width:0;max-width:36px;height:32px;display:grid;place-items:center;border-radius:10px}
.dot i{width:11px;height:11px;border-radius:50%;border:1.4px solid var(--c);background:transparent;transition:background .25s,box-shadow .25s,transform .12s;transform:scale(var(--lv,1))}
.dot[aria-pressed=true] i{background:var(--c);box-shadow:0 0 12px -1px var(--c)}
.mst{flex:0 0 40px;max-width:40px;color:var(--dim);transition:color .3s}
.mst svg{width:17px;height:17px;display:block;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;transition:filter .3s}
.mst[aria-pressed=true]{color:var(--warm)}
.mst[aria-pressed=true] svg{filter:drop-shadow(0 0 5px var(--warm))}
/* what is on record about a satellite: plain facts in small type, over the lower part of the world */
.card{position:fixed;z-index:6;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--foot,112px) + 6px);max-width:430px;margin:0 auto;
  padding:11px 13px 9px;border-radius:14px;background:rgba(1,4,10,.74);border:1px solid rgba(234,249,255,.16);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  font-family:var(--mono);font-size:10px;line-height:1.5;letter-spacing:.03em;color:var(--dim);pointer-events:none}
.card .cn{margin:0;font-family:var(--display);font-weight:800;font-variation-settings:"wdth" 70;font-size:19px;line-height:1;letter-spacing:.02em;text-transform:uppercase;color:var(--ink);overflow-wrap:anywhere}
.card .ck{margin:4px 0 7px;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--lume)}
.card dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:1px 10px}
.card dt{color:rgba(234,249,255,.45);text-transform:uppercase;font-size:8.5px;letter-spacing:.12em;padding-top:1.5px;white-space:nowrap}
.card dd{margin:0;color:var(--ink);min-width:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.card .cs{margin:6px 0 0;font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:rgba(234,249,255,.35)}
.rail{display:flex;justify-content:center;gap:clamp(0px,1vw,10px);pointer-events:auto;padding:5px 6px;border-radius:16px;background:rgba(1,4,10,.5);
  border:1px solid rgba(234,249,255,.1);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);max-width:100%}
.wb{display:flex;flex-direction:column;align-items:center;gap:4px;width:clamp(56px,17vw,74px);padding:7px 0 6px;border-radius:11px;color:var(--dim);transition:color .3s,background .3s}
.wb svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
.wb span{font-family:var(--mono);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;line-height:1}
.wb:hover{color:var(--ink)}
.wb[aria-current=true]{color:var(--lume);background:rgba(62,240,255,.09)}
@media (max-height:480px){
  .mark .wname{font-size:24px}
  .data{top:calc(50px + env(safe-area-inset-top,0px))}
  .wb{padding:4px 0}
  .wb span{display:none}
  .foot{gap:2px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  .dot{height:24px}
  .card{font-size:9px;padding:8px 11px 7px}
  .card .cn{font-size:15px}
}
/* on a wide screen, and on a phone held sideways, the card stands at the right and the Earth moves over for it */
@media (min-width:760px),(min-width:560px) and (max-height:480px){
  .card{left:auto;right:max(16px,env(safe-area-inset-right,0px));width:min(330px,46vw);margin:0;max-height:calc(100vh - var(--foot,112px) - 14px);overflow:hidden}
}
/* sideways and short: the card is wider and set smaller, and stays clear of the button above it */
@media (min-width:560px) and (max-height:480px){
  .card{width:min(400px,60vw);max-height:calc(100vh - var(--foot,80px) - 58px - env(safe-area-inset-top,0px));font-size:8.5px;line-height:1.38;padding:7px 10px 6px}
  .card .cn{font-size:14px}
  .card .ck{margin:3px 0 4px;font-size:8px}
  .card .cs{display:none}
}
@media (min-width:900px){
  .mark .wname{font-size:46px}
  .data{top:calc(78px + env(safe-area-inset-top,0px));font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){
  #gl,#ov,.ic,.wb,.dot i,.mst,.dots9,.vid,.vid .vb{transition:none}
}
</style>

<canvas id="gl" aria-hidden="true"></canvas>
<div class="vid" id="vid" hidden aria-hidden="true"><div class="vb" id="vidbox"><div id="vidp"></div><img id="vidi" alt="" hidden></div></div>
<canvas id="ov" aria-hidden="true"></canvas>
<div id="stage" role="application" aria-label="The world. Touch it, drag through it, use more than one finger"></div>

    <button class="ic" id="bClear" type="button" hidden aria-label="Take the photo away"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>

  </div>
</header>
<p class="data" id="data" aria-live="off"></p>

<aside class="card" id="card" hidden aria-live="polite"></aside>

<footer class="foot" id="foot">
  <div class="lyr" id="lyr" hidden role="group" aria-label="Layers of the weather"></div>
  <div class="tools" id="tools" hidden role="toolbar" aria-label="Build in the water"></div>
  <div class="dots" id="dotrow" role="group" aria-label="The music: the whole band, then each of its nine players">
    <button class="dot mst" id="bSound" type="button" aria-pressed="false" aria-label="Music starts with your first touch. Turn it on now"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 11.6V3.4l6-1.2v8.2"/><circle cx="4.6" cy="11.7" r="1.7"/><circle cx="10.6" cy="10.5" r="1.7"/></svg></button>
    <span class="dots9" id="dots"></span>
  </div>
  <nav class="rail" id="rail" aria-label="Worlds"></nav>
</footer>
<input class="sr" type="file" id="file" accept="image/*" tabindex="-1" aria-hidden="true">

function pent(d,base){d=Math.round(d);var o=Math.floor(d/5);return (base||40)+12*o+PENT[d-o*5]}
